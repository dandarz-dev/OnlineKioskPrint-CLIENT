<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Print Kiosk Portal</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #071618;
            background-image: radial-gradient(circle at 70% 20%, #0d2e33 0%, #071618 70%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1; 
        }

        .card {
            background: rgba(11, 31, 35, 0.9); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(20, 184, 166, 0.25);
            width: 100%;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(20, 184, 166, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(20, 184, 166, 0.15);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(20, 184, 166, 0.4);
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.2);
            flex-shrink: 0;
        }

        .header-text {
            text-align: left;
        }

        .header h2 {
            color: #ffffff;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #5eead4;
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #99f6e4;
            margin-bottom: 5px;
        }

        input[type="file"], input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(20, 184, 166, 0.25);
            border-radius: 12px;
            font-size: 16px; 
            color: #ffffff;
            outline: none;
            background: rgba(7, 22, 24, 0.9);
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235eead4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="file"] {
            font-size: 13px;
        }

        input[type="file"]::file-selector-button {
            background: rgba(20, 184, 166, 0.2);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #5eead4;
            font-weight: 500;
            cursor: pointer;
            margin-right: 10px;
        }

        input:focus, select:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.25);
        }

        option {
            background: #0b1f23;
            color: #ffffff;
        }

        .price-box {
            background: rgba(7, 22, 24, 0.8);
            border: 1px solid rgba(20, 184, 166, 0.2);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            margin-top: 18px;
        }

        .price-box p {
            color: #99f6e4;
            font-size: 11px;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .price-box h3 {
            color: #2dd4bf;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            box-shadow: 0 4px 20px rgba(20, 184, 166, 0.4);
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #134e4a;
            box-shadow: none;
            cursor: not-allowed;
            color: #5eead4;
            opacity: 0.5;
        }

        .footer-credit {
            margin-top: 14px;
            color: #5eead4;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="app-wrapper">
    <div class="card">
        <div class="header">
            <img src="mylogo.png" alt="Dandarz Logo" class="logo">
            <div class="header-text">
                <h2>Smart Print Kiosk Portal</h2>
                <p>1. Details -> 2. Attach -> 3. Configure -> 4. Print</p>
            </div>
        </div>

        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label>1. Attach File (PDF, Word, Excel, Images)</label>
            <input type="file" id="fileInput" accept="application/pdf, .doc, .docx, .xls, .xlsx, image/*">
        </div>

        <div class="form-group">
            <label>2. Paper Size</label>
            <select id="paperSize">
                <option value="short">Short / A4</option>
                <option value="long">Long</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. Content Type & Pricing</label>
            <select id="printType">
                <option value="mono">Monochrome / Black & White</option>
                <option value="color">Color Text or Picture</option>
            </select>
        </div>

        <div class="form-group">
            <label>4. Select Printer Model</label>
            <select id="printerModel">
                <option value="Epson L3110 Series">Epson L3110 Series (USB/Local)</option>
                <option value="HP LaserJet 107w">HP LaserJet 107w (Wireless)</option>
                <option value="Canon G2010 Series">Canon G2010 Series (Tank)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Number of Copies</label>
            <input type="number" id="copies" value="1" min="1">
        </div>

        <div class="price-box">
            <p>Pages Detected: <span id="pageCount" style="font-weight:600; color:#ffffff;">0</span> | Rate: ₱<span id="unitRate">1.00</span>/page</p>
            <h3>₱<span id="totalPrice">0.00</span></h3>
        </div>

        <button id="submitBtn">Proceed to Print</button>
    </div>
    
    <div class="footer-credit">
        App developed by: dandarz &copy; 2026 Ph[cite: 1]
    </div>
</div>

<!-- Firebase SDK & Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, increment, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCTfn6Deljs5y2KfyLKoL5Y-yQl-geGvE8",
        authDomain: "emprintservices-13035.firebaseapp.com",
        projectId: "emprintservices-13035",
        storageBucket: "emprintservices-13035.firebasestorage.app",
        messagingSenderId: "262351786921",
        appId: "1:262351786921:web:097d79bb3aa00ae0182ab8",
        measurementId: "G-4FLMGED2ZC"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    let totalPages = 0;

    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.type === 'application/pdf') {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                totalPages = pdf.numPages;
                document.getElementById('pageCount').innerText = totalPages;
                calculatePrice();
            } catch (error) {
                console.error("PDF parsing error:", error);
                alert("Unable to read the PDF file. Please try another file.");
                resetFileInput(e);
            }
        } else if (
            file.type.includes('image/') || 
            file.name.match(/\.(doc|docx|xls|xlsx)$/i)
        ) {
            totalPages = 1;
            document.getElementById('pageCount').innerText = totalPages;
            calculatePrice();
        } else {
            alert('Please upload a valid PDF, Word, Excel, or Image file.');
            resetFileInput(e);
        }
    });

    function resetFileInput(e) {
        e.target.value = '';
        totalPages = 0;
        document.getElementById('pageCount').innerText = '0';
        calculatePrice();
    }

    document.getElementById('paperSize').addEventListener('change', calculatePrice);
    document.getElementById('printType').addEventListener('change', calculatePrice);
    document.getElementById('copies').addEventListener('input', calculatePrice);

    function getPricePerPage() {
        const size = document.getElementById('paperSize').value; 
        const type = document.getElementById('printType').value; 

        if (size === 'short') {
            return type === 'mono' ? 1.00 : 2.00;
        } else {
            return type === 'mono' ? 2.00 : 3.00;
        }
    }

    function calculatePrice() {
        const pricePerPage = getPricePerPage();
        document.getElementById('unitRate').innerText = pricePerPage.toFixed(2);
        
        const copies = parseInt(document.getElementById('copies').value) || 1;
        const total = totalPages * pricePerPage * copies;
        document.getElementById('totalPrice').innerText = total.toFixed(2);
    }

    // Google Drive Upload Function
    async function uploadFileToDrive(fileInputObj) {
        const file = fileInputObj.files[0];
        if (!file) return "";

        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    base64: base64Data
                };

                try {
                    // Paspasa o ilisi kini sa imong Google Apps Script Web App URL (sa sulod sa quotation marks)
                    const responseUrl = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 
                    const res = await fetch(responseUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        resolve(result.fileUrl);
                    } else {
                        reject(result.message);
                    }
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('submitBtn').addEventListener('click', async function() {
        const customerName = document.getElementById('customerName').value.trim();

        if(!customerName) {
            alert("Please enter your name.");
            document.getElementById('customerName').focus();
            return;
        }

        if(totalPages === 0) {
            alert("Please upload a file before proceeding.");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true; 
        btn.innerText = "Uploading to Drive...";

        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const totalPrice = parseFloat(document.getElementById('totalPrice').innerText);
        const paperSize = document.getElementById('paperSize').options[document.getElementById('paperSize').selectedIndex].text;
        const printType = document.getElementById('printType').options[document.getElementById('printType').selectedIndex].text;
        
        const printerModelSelect = document.getElementById('printerModel');
        const printerModel = printerModelSelect.value;
        
        const copies = parseInt(document.getElementById('copies').value);
        const totalPaperUsed = totalPages * copies;

        try {
            // I-upload sa Google Drive pinaagi sa Apps Script una i-save sa Firestore
            let fileUrl = "";
            try {
                fileUrl = await uploadFileToDrive(fileInput);
            } catch (uploadErr) {
                console.error("Drive upload error:", uploadErr);
                alert("Dili kasandigan ang pag-upload sa Drive pero ipadayon nato ang order. Pwede ra nimo i-add ang link manually sa admin panel kung gikinahanglan.");
            }

            btn.innerText = "Processing Order...";
            const docRef = await addDoc(collection(db, "print_jobs"), {
                customerName: customerName,
                fileName: file.name,
                fileType: file.type || "Office/Image Document",
                fileUrl: fileUrl, // Dinhi ma-save ang direktang Google Drive link para mabasa sa Admin.html
                totalPages: totalPages,
                copies: copies,
                paperSize: paperSize,
                printType: printType,
                printerModel: printerModel,
                amountDue: totalPrice,
                status: "Pending Payment",
                timestamp: new Date()
            });

            const inventoryRef = doc(db, "inventory", "paper_stock");
            const inventorySnap = await getDoc(inventoryRef);

            if (inventorySnap.exists()) {
                await updateDoc(inventoryRef, {
                    remaining_pages: increment(-totalPaperUsed) 
                });
            } else {
                await setDoc(inventoryRef, {
                    remaining_pages: 500 - totalPaperUsed
                });
            }

            alert(`Thank you, ${customerName}! Your order was successful.\nTransaction ID: ${docRef.id}\nYour print job has been routed to: ${printerModel}`);
            
            // Clear inputs
            document.getElementById('customerName').value = '';
            fileInput.value = '';
            totalPages = 0;
            document.getElementById('pageCount').innerText = '0';
            document.getElementById('copies').value = '1';
            calculatePrice();
            
        } catch (e) {
            console.error("Error adding document: ", e);
            alert("Database connection error. Please check your internet connection or Firebase Firestore rules.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Proceed to Print";
        }
    });
</script>
</body>
</html>
